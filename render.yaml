services:
  - type: web
    name: vera-bot
    runtime: python
    plan: starter            # free plan sleeps when idle -> healthz failures; use an always-on plan for the test
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    envVars:
      - key: TEAM_NAME
        value: Vera++
      - key: PYTHON_VERSION
        value: 3.12.6
